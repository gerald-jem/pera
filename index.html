<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authView" class="auth" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Pera</h1>
  <p class="muted" id="authMsg">Sign in to sync your money across your devices.</p>
  <form id="authForm" novalidate>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="6" required>
    <div class="err" id="authErr" role="alert"></div>
    <button class="go" id="authGo">Sign in</button>
    <button type="button" class="plain" id="authSwitch">New here? Create an account</button>
  </form>
</div>

<div id="mainView" hidden>
<div class="app">
  <div class="top"><span class="sync" id="sync"><i></i><span id="syncTxt">Pera</span></span><button class="ghost" id="settingsBtn">Settings</button></div>

  <section class="view on" id="v-home">
    <div class="home-main">
    <div class="muted" id="homeLbl">Total money</div>
    <div class="big" id="homeTotal">₱0</div>
    <div class="chg" id="homeChg"></div>
    <div class="fig"><svg id="chart" role="img" aria-label="Running total money by month"></svg></div>
    <div class="legend"><span>— actual</span><span>┄ planned</span></div>
    <div class="trio" id="homeTrio"></div>
    </div>
    <div class="home-side">
    <h2 id="homeListH">This month</h2>
    <ul class="list" id="homeList"></ul>
    </div>
  </section>

  <section class="view" id="v-months">
    <h1>Months</h1>
    <div class="seg" id="yearSeg"></div>
    <ul class="list" id="monthList" style="margin-top:8px"></ul>
    <p class="muted" id="yearFoot"></p>
  </section>

  <section class="view" id="v-savings">
    <h1>Savings</h1>
    <div id="savWrap"></div>
  </section>

  <section class="view" id="v-bills">
    <h1>Bills</h1>
    <p class="muted">Tap the circle when paid. Tap a bill to edit or delete it.</p>
    <ul class="list" id="billList"></ul>
    <button class="go" id="addBill">Add a bill</button>
  </section>
</div>

<div class="tabs"><nav>
  <div class="brand"><img src="icon-192.png" alt="">Pera</div>
  <button class="tab" data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tab" data-v="months"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Months</button>
  <div><button class="fab" id="fab" aria-label="Add entry"><span aria-hidden="true">+</span><span class="fab-txt">Add entry</span></button></div>
  <button class="tab" data-v="savings"><svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM2 10l10-6 10 6M8 14v3M12 14v3M16 14v3"/></svg>Savings</button>
  <button class="tab" data-v="bills"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Bills</button>
</nav></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" hidden>Undo</button></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
